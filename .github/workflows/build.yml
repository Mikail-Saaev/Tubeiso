# Fabrique automatiquement l'executable pour Windows, macOS et Linux.
#
# Deposez ce projet sur GitHub : a chaque poussee, ce workflow construit les
# trois binaires et les met a disposition en telechargement dans l'onglet
# Actions. Aucun outil a installer sur votre poste.
#
# Un tag `v1.0.0` cree en plus une Release publique avec les archives.

name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: tubeiso-windows.zip
          - os: macos-latest
            name: macos
            archive: tubeiso-macos.zip
          - os: ubuntu-latest
            name: linux
            archive: tubeiso-linux.zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    # Necessaire pour que l'etape "Publier la release" puisse ecrire.
    # Sans cela, elle echoue avec une erreur 403 sur les depots recents,
    # ou le jeton par defaut est en lecture seule.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verifier les tests
        run: python tests/test_tubeiso.py

      - name: Construire l'executable
        run: pyinstaller tubeiso.spec --noconfirm --clean

      - name: Verifier que le binaire demarre
        shell: bash
        run: |
          cd dist/tubeiso
          if [ "${{ matrix.name }}" = "windows" ]; then BIN=./tubeiso.exe; else BIN=./tubeiso; fi
          "$BIN" --help

      - name: Archiver
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            powershell -c "Compress-Archive -Path tubeiso -DestinationPath ${{ matrix.archive }}"
          else
            zip -qr ${{ matrix.archive }} tubeiso
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          retention-days: 14
          compression-level: 0   # l'archive est deja compressee

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}
