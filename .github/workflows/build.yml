# Fabrique automatiquement l'executable pour Windows, macOS et Linux.
#
# Chaque etape est isolee pour qu'un echec designe immediatement sa cause.
# Windows est le travail principal ; macOS est tolerant a l'echec, car les
# roues du noyau CAO n'existent pas toujours pour son processeur ARM.

name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            archive: tubeiso-windows.zip
            optional: false
          - os: ubuntu-latest
            name: linux
            archive: tubeiso-linux.zip
            optional: false
          - os: macos-latest
            name: macos
            archive: tubeiso-macos.zip
            optional: true

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environnement
        run: python -c "import platform, sys; print(sys.version); print(platform.platform())"

      - name: Mettre a jour pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Installer numpy, openpyxl, ezdxf
        run: python -m pip install "numpy>=1.24" "openpyxl>=3.1" "ezdxf>=1.1" "flask>=3.0"

      - name: Installer le noyau CAO
        run: python -m pip install "cadquery==2.8.0"

      - name: Installer PyInstaller
        run: python -m pip install "pyinstaller>=6.6"

      - name: Verifier que le noyau CAO se charge
        run: python tools/check_cad.py

      - name: Lancer les tests
        shell: bash
        run: python tests/test_tubeiso.py

      - name: Preparer la reference de simulation
        run: python tests/simulation_ref.py exemple_LFT.xlsx

      - name: Verifier la simulation de cintrage
        run: node tests/test_simulation.mjs

      - name: Construire l'executable
        run: pyinstaller tubeiso.spec --noconfirm --clean

      - name: Verifier que le binaire demarre (Windows)
        if: matrix.name == 'windows'
        run: dist\tubeiso\tubeiso.exe --help

      - name: Verifier que le binaire demarre (Unix)
        if: matrix.name != 'windows'
        run: ./dist/tubeiso/tubeiso --help

      - name: Archiver (Windows)
        if: matrix.name == 'windows'
        run: Compress-Archive -Path dist\tubeiso -DestinationPath dist\${{ matrix.archive }}

      - name: Archiver (Unix)
        if: matrix.name != 'windows'
        run: cd dist && zip -qr ${{ matrix.archive }} tubeiso && ls -la ${{ matrix.archive }}

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          retention-days: 14
          compression-level: 0

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}
